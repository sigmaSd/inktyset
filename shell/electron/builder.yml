# Packaging Inktyset (`vp run dist`, after `vp build` and `vp pack`): electron-builder, into dist/packages/.
# The package holds Electron, the bundled main process (dist/app/), the built window (app/ui/dist/) and the
# icon — no node_modules: everything is bundled. The engine (llama.cpp), the model and Tectonic are not in it:
# Inktyset downloads them on first start (src/components.ts), so the installers stay small.
# Linux packages are built on Linux; Windows and macOS ones on those systems (or in CI, one runner each).

appId: io.github.sigmasd.inktyset
productName: Inktyset
copyright: Copyright © 2026 Bedis Nbiba — GPL-3.0-or-later
directories:
  output: dist/packages
files:
  - dist/app/**
  - app/ui/dist/**
  - app/icon.png
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/node_modules/**"
asar: true

linux:
  target: [AppImage, deb, rpm]
  category: Office
  icon: app/icon.png
  executableName: inktyset
  maintainer: Bedis Nbiba
  synopsis: Handwritten math to LaTeX, on your own computer
  description: Turn photos and scans of handwritten mathematics into LaTeX. Everything runs on your computer.
  syncDesktopName: true # the windows belong to inktyset.desktop (package.json desktopName)
  desktop:
    entry:
      Name: Inktyset
      Comment: Turn photos and scans of handwritten math into LaTeX
      Keywords: latex;math;handwriting;scan;ocr;
appImage:
  artifactName: Inktyset-${version}-${arch}.AppImage
# the current AppImage runtime (libfuse 3 built in), as in MedStation: the old default needs FUSE 2, gone from Fedora
toolsets:
  appimage: "1.0.3"
deb:
  artifactName: inktyset_${version}_${arch}.deb
rpm:
  artifactName: inktyset-${version}.${arch}.rpm

win:
  target: nsis
  icon: app/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Inktyset-${version}-setup.exe

mac:
  target: [dmg, zip] # the zip is what automatic updates download
  category: public.app-category.education
  icon: app/icon.png
  # Not signed with a developer certificate (users open it once with right-click → Open; the website says how).
  # Ad-hoc signed ("-") because Apple Silicon refuses to run an app with no signature at all; without the
  # hardened runtime, which with an ad-hoc signature rejects Electron's own frameworks (electron-builder's docs).
  identity: "-"
  hardenedRuntime: false

# Automatic updates (shell/electron/updates.ts) and the website's download buttons read the GitHub releases.
# CI (.github/workflows/release.yml) builds each system's packages for a v* tag and uploads them there, with
# the latest*.yml files electron-updater reads.
publish:
  provider: github
  owner: sigmaSd
  repo: inktyset
  releaseType: release
